services:

  postgres:
    image: postgres:18
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Madhu@123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  banking:
    image: banking-api:latest
    container_name: banking
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/banking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Madhu@123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://host.docker.internal:8180/realms/banking-realm/protocol/openid-connect/certs

      KEYCLOAK_SERVER_URL: http://host.docker.internal:8180
      KEYCLOAK_REALM: banking-realm
      KEYCLOAK_ADMIN_CLIENT_ID: banking-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: hyXhSOjFFRJQTcALPUQdiN7OvGS0dMyfR0puiXqTsfETgZNYsbtIMpqXgG1v6HMyMYsOIpQbt1eyoyY1mvmZx4
  nginx:
    image: nginx:latest
    container_name: banking-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./banking-frontend:/usr/share/nginx/html:ro
    depends_on:
      - banking

volumes:
  postgres_data: